# Static-only hosting. Point root at the built dist directory.
# Email delivery remains unavailable unless /api is separately routed to the Express service.
server {
    listen 80;
    server_name _;
    root /var/www/rockvalle/dist;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        try_files $uri $uri/index.html =404;
    }
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }
    location /api/ {
        return 503;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
